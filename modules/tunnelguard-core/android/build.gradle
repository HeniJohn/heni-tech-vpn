plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tunnelguardcore'
version = '1.0.0'

android {
  namespace "expo.modules.tunnelguardcore"
  compileSdkVersion 35
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName "1.0.0"
  }
}

// The current clean-source bridge owns the Android VpnService lifecycle locally.
// Protocol-specific native cores are added only after their audited artifacts are
// available; no nonexistent or placeholder libbox dependency is required to build.
