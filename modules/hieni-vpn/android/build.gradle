apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

android {
  namespace 'com.henijohn.henivpn'

  defaultConfig {
    minSdk 24
    versionCode 1
    versionName '1.0.0'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation 'com.github.mwiede:jsch:2.28.6'
}
